name: forsa_drive
description: ForsaDrive - Tunisia's #1 ride-sharing platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.0

  # Routing
  go_router: ^14.0.0

  # State Management
  provider: ^6.1.0

  # Local Storage
  shared_preferences: ^2.2.0

  # Internationalization
  intl: ^0.20.0

  # UI
  google_fonts: ^6.2.0
  cached_network_image: ^3.3.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Maps
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

  # Time formatting
  timeago: ^3.6.0

  # URL launcher
  url_launcher: ^6.3.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

